name: Retappd
options:
  bundleIdPrefix: com.davidsansome
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7B2GP77Y4A
    CODE_SIGN_STYLE: Automatic
targets:
  Retappd:
    type: application
    platform: iOS
    sources:
      - path: Retappd
        excludes: ["*.entitlements", "Info.plist"]
    # Keys Xcode's INFOPLIST_KEY_ settings don't cover; merged with the generated Info.plist.
    info:
      path: Retappd/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        # Where the notification relay lives (see .claude/notify-contract.md); placeholder until deployed.
        RetappdNotifyBaseURL: "https://retappd-notify.example.workers.dev"
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidsansome.retappd
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Retappd
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to take a photo of your beer when you check in."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to find the venue you're at and nearby places to check in."
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to scan a beer's barcode to find it."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Your most recent photo can be attached to a check-in."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: Retappd/Retappd.entitlements
        # Only HTTPS, which is exempt: TestFlight builds then don't wait on an export compliance answer.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  RetappdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RetappdTests
    dependencies:
      - target: Retappd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Retappd:
    build:
      targets:
        Retappd: all
        RetappdTests: [test]
    test:
      targets:
        - RetappdTests
