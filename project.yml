name: Retappd
options:
  bundleIdPrefix: dev.retappd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7B2GP77Y4A
    CODE_SIGN_STYLE: Automatic
targets:
  Retappd:
    type: application
    platform: iOS
    sources:
      - path: Retappd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.retappd.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Retappd
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to find the venue you're at and nearby places to check in."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  RetappdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RetappdTests
    dependencies:
      - target: Retappd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Retappd:
    build:
      targets:
        Retappd: all
        RetappdTests: [test]
    test:
      targets:
        - RetappdTests
